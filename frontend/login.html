<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · PAYFLOW</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-body">
  <div class="auth-panel">
    <div class="auth-card">
      <div class="brand">
        <div class="brand-mark">P</div>
        <div class="brand-name">PAY<span>FLOW</span></div>
      </div>

      <h2>Welcome back</h2>
      <div class="muted">Sign in to your PAYFLOW account.</div>

      <form id="login-form">
        <div class="field">
          <label for="username">Username or email</label>
          <input id="username" required autocomplete="username" placeholder="aditi_sharma">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" type="password" required autocomplete="current-password" placeholder="Enter your password">
            <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password">Show</button>
          </div>
        </div>
        <div class="field hidden" id="mfa-field">
          <label for="totp">Authenticator code</label>
          <input id="totp" inputmode="numeric" placeholder="6-digit code">
        </div>
        <div id="login-error" class="danger text-sm hidden"></div>
        <button class="btn btn-primary btn-block mt-1" id="login-btn" type="submit">Sign In →</button>
      </form>

      <div class="auth-footer">New here? <a href="/register.html">Create an account</a></div>
      <div class="auth-hint">Demo: <b>aditi_sharma / Customer@123</b></div>
      <div class="auth-footer"><a href="/">← Back to home</a></div>
    </div>
  </div>
  <div class="toast-stack" id="toast-stack"></div>
  <script src="/js/api.js"></script>
  <script>
    (function () {
      const form = document.getElementById('login-form');
      const errBox = document.getElementById('login-error');
      const mfaField = document.getElementById('mfa-field');
      const pw = document.getElementById('password');
      const toggle = document.getElementById('pw-toggle');

      toggle.onclick = function () {
        const show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        toggle.textContent = show ? 'Hide' : 'Show';
        pw.focus();
      };

      form.onsubmit = async function (e) {
        e.preventDefault();
        errBox.classList.add('hidden');
        const btn = document.getElementById('login-btn');
        btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Authenticating…';
        const body = {
          username: document.getElementById('username').value.trim(),
          password: pw.value
        };
        const totp = document.getElementById('totp').value.trim();
        if (totp) body.totp_code = totp;
        try {
          const result = await PF.api('/auth/login', { method: 'POST', body: body });
          if (result.mfa_required) {
            mfaField.classList.remove('hidden');
            PF.toast('Enter your authenticator code', 'info');
          } else {
            location.href = '/index.html';
          }
        } catch (err) {
          errBox.textContent = err.message;
          errBox.classList.remove('hidden');
        } finally {
          btn.disabled = false; btn.textContent = 'Sign In →';
        }
      };
    })();
  </script>
</body>
</html>
