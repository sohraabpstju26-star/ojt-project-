<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · PAYFLOW</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-body">
  <div class="auth-panel">
    <div class="auth-card">
      <div class="brand">
        <div class="brand-mark">P</div>
        <div class="brand-name">PAY<span>FLOW</span></div>
      </div>

      <h2>Create account</h2>
      <div class="muted">Your wallet and ledger account are provisioned instantly.</div>

      <form id="register-form">
        <div class="field"><label for="full_name">Full name</label><input id="full_name" required placeholder="Aditi Sharma"></div>
        <div class="field"><label for="username">Username</label><input id="username" required pattern="[a-zA-Z0-9_]+" placeholder="aditi_sharma"></div>
        <div class="form-row">
          <div class="field"><label for="email">Email</label><input id="email" type="email" required placeholder="you@example.com"></div>
          <div class="field"><label for="phone">Phone</label><input id="phone" required placeholder="+919876543210"></div>
        </div>
        <div class="field">
          <label for="role">Account type</label>
          <select id="role"><option>Customer</option><option>Merchant</option></select>
        </div>
        <div class="field">
          <label for="password">Password (min 8 characters)</label>
          <div class="password-wrap">
            <input id="password" type="password" minlength="8" required placeholder="Create a password">
            <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password">Show</button>
          </div>
        </div>
        <div id="reg-error" class="danger text-sm hidden"></div>
        <button class="btn btn-primary btn-block mt-1" id="reg-btn" type="submit">Create Account →</button>
      </form>

      <div class="auth-footer">Already registered? <a href="/login.html">Sign in</a></div>
      <div class="auth-footer"><a href="/">← Back to home</a></div>
    </div>
  </div>
  <div class="toast-stack" id="toast-stack"></div>
  <script src="/js/api.js"></script>
  <script>
    (function () {
      const form = document.getElementById('register-form');
      const errBox = document.getElementById('reg-error');
      const pw = document.getElementById('password');
      const toggle = document.getElementById('pw-toggle');
      toggle.onclick = function () {
        const show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        toggle.textContent = show ? 'Hide' : 'Show';
        pw.focus();
      };
      form.onsubmit = async function (e) {
        e.preventDefault();
        errBox.classList.add('hidden');
        const btn = document.getElementById('reg-btn');
        btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Provisioning…';
        try {
          await PF.api('/auth/register', { method: 'POST', body: {
            full_name: document.getElementById('full_name').value.trim(),
            username: document.getElementById('username').value.trim(),
            email: document.getElementById('email').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            role: document.getElementById('role').value,
            password: pw.value
          }});
          location.href = '/index.html';
        } catch (err) {
          errBox.textContent = err.message;
          errBox.classList.remove('hidden');
          btn.disabled = false; btn.textContent = 'Create Account →';
        }
      };
    })();
  </script>
</body>
</html>
