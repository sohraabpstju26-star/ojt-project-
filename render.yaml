services:
  - type: web
    name: payflow
    env: python
    plan: free
    region: singapore
    pythonVersion: "3.11.0"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PAYFLOW_SECURE_COOKIES
        value: "1"
